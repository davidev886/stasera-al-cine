<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stasera al cine a Milano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- loaded without blocking the first paint: system fonts until it arrives -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --ink: #141821; --muted: #5B6372; --line: #DADFE6;
  --tram: #F2A000; --tram-ink: #1A1300; --warn: #7A4300; --warn-bg: #FFF1CC;
  color-scheme: light dark;
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1420; --surface: #182031; --ink: #E9ECF2; --muted: #9AA3B2; --line: #2B3346;
          --warn: #FFD58A; --warn-bg: #3A2A08; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
.display { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600; }

header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 720px; margin: 0 auto; padding: 8px 16px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; margin-bottom: 6px; }
h1 { font-size: 20px; line-height: 1; margin: 0; }
/* 16px: below that, iOS zooms the page when the field gets focus */
#q { width: 100%; min-height: 38px; padding: 6px 12px; font: inherit; font-size: 16px;
     color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row { display: flex; gap: 6px; margin: 6px -16px 0; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 32px; padding: 0 11px; font: inherit; font-size: 14px; cursor: pointer;
        color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.chip.partial { border-style: dashed; }
.chip.vo[aria-pressed="true"] { color: var(--tram-ink); background: var(--tram); border-color: var(--tram); }
#status { margin: 0; font-size: 12px; color: var(--muted); }
#status.warn { padding: 2px 8px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; }

main { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }
.note { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
article { padding: 18px 0 14px; border-bottom: 1px solid var(--line); }
h2 { margin: 0 0 6px; font-size: 30px; line-height: 1.02; overflow-wrap: anywhere; }
h3 { display: flex; align-items: center; gap: 10px; margin: 18px 0 4px; font-size: 22px; line-height: 1.1; color: var(--ink); }
h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
h3 small { font: 400 13px/1 system-ui, sans-serif; color: var(--muted); }
.cin { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 10px; }
.where { flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.where .name { font-size: 15px; font-weight: 600; }
.where .dist { font-size: 13px; font-weight: 600; color: var(--ink); }
.search { display: flex; gap: 6px; }
.search #q { flex: 1; min-width: 0; }
.chip.near { display: inline-flex; align-items: center; gap: 4px; min-height: 38px; border-radius: 10px; }
.chip.near svg { width: 13px; height: 13px; fill: currentColor; }
.map { display: inline-flex; align-items: center; gap: 3px; min-height: 24px; font-size: 13px; color: var(--muted);
       text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.map:hover { color: var(--ink); text-decoration-color: currentColor; }
.map svg { flex: none; width: 13px; height: 13px; fill: currentColor; align-self: center; }
.t { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 50px; min-height: 34px;
     padding: 0 8px; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink); text-decoration: none;
     background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
.t.vo { border-color: var(--tram); }
.t.vo::after { content: "V.O."; padding: 2px 3px; font: 700 9px/1 system-ui, sans-serif;
               color: var(--tram-ink); background: var(--tram); border-radius: 4px; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.empty button { margin-top: 12px; }
:focus-visible { outline: 3px solid var(--tram); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1 class="display">Stasera al cine</h1>
      <p id="status" aria-live="polite">Carico gli orari…</p>
    </div>
    <label class="sr" for="q">Cerca un film</label>
    <div class="search">
      <input id="q" type="search" placeholder="Cerca un film" autocomplete="off" enterkeyhint="search">
      <button type="button" class="chip near" id="near" aria-pressed="false"></button>
    </div>
    <div class="row" id="days" role="group" aria-label="Giorno"></div>
    <div class="row" id="slots" role="group" aria-label="Orario e lingua"></div>
  </div>
</header>
<main id="list"></main>

<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
// same normalisation as film_key() in scrape.py, so "gialappàs" finds "Gialappa's"
const norm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/(\w)['’](\w)/g, "$1$2").replace(/[^a-z0-9]+/g, " ").trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https:\/\//.test(u) ? esc(u) : "#";
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
// a 00:20 show belongs to the evening before (s.day, from scrape.py) and counts as hour 24
const hourOf = s => { const h = +s.start.slice(11, 13); return h < 5 ? h + 24 : h; };

const SLOTS = [["all", "Tutto il giorno", 0, 29], ["pre", "Prima delle 18", 0, 18], ["sera", "18–21", 18, 21], ["tardi", "Dopo le 21", 21, 29]];
const state = { q: "", day: "all", dayTouched: false, slot: "all", vo: false, near: false, locating: false, pos: null, geoMsg: "" };
// straight-line distance in km (haversine): computed on the phone, the position never leaves it
const km = (a, b) => {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};
const fmtKm = d => (d < 10 ? d.toLocaleString("it-IT", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : Math.round(d)) + " km";

// GPS only on demand: the browser asks for permission the first time the button is pressed
function locate() {
  if (!navigator.geolocation) { state.geoMsg = "Questo browser non dà accesso alla posizione."; return render(); }
  state.locating = true; state.geoMsg = ""; render();
  navigator.geolocation.getCurrentPosition(p => {
    Object.assign(state, { locating: false, near: true, pos: { lat: p.coords.latitude, lon: p.coords.longitude } });
    render();
  }, err => {
    Object.assign(state, { locating: false, near: false, geoMsg: err.code === 1
      ? "Posizione non consentita: puoi attivarla dalle impostazioni del browser per questo sito."
      : "Non riesco a trovare la posizione: riprova tra poco." });
    render();
  }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 5 * 60e3 });
}
let D, days = [], partial = new Set(), missing = {};

function dayLabel(k) {
  const today = new Date(), tomorrow = new Date(Date.now() + 864e5);
  if (k === isoDay(today)) return "Oggi";
  if (k === isoDay(tomorrow)) return "Domani";
  const s = new Date(k + "T12:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric" });
  return s[0].toUpperCase() + s.slice(1);
}

function chip(label, pressed, attrs, cls = "") {
  return `<button type="button" class="chip ${cls}" aria-pressed="${pressed}" ${attrs}>${label}</button>`;
}

function renderControls() {
  const day = effectiveDay();
  $("#days").innerHTML = chip("Tutti i giorni", day === "all", 'data-day="all"') +
    days.map(k => chip(dayLabel(k) + (partial.has(k) ? " (parziale)" : ""), day === k, `data-day="${k}"`, partial.has(k) ? "partial" : "")).join("");
  $("#slots").innerHTML = SLOTS.map(([id, label]) => chip(label, state.slot === id, `data-slot="${id}"`)).join("") +
    chip("Solo V.O.", state.vo, 'data-vo="1"', "vo");
  $("#near").innerHTML = PIN + (state.locating ? "Cerco…" : "Vicino a me");
  $("#near").setAttribute("aria-pressed", state.near);
}

// typing a title means "where and when, any day": unless a day was picked by hand
const effectiveDay = () => state.q && !state.dayTouched ? "all" : state.day;
const nowStamp = () => { const n = new Date(); return `${isoDay(n)}T${pad(n.getHours())}:${pad(n.getMinutes())}`; };

function render() {
  renderControls();
  const nowS = nowStamp(), q = norm(state.q), day = effectiveDay();
  const [, , from, to] = SLOTS.find(s => s[0] === state.slot);
  const films = new Map();  // key -> {film, days: Map(day -> Map(cinema -> [show]))}; shows arrive sorted
  for (const s of D.shows) {
    const h = hourOf(s);
    if (s.start < nowS || (day !== "all" && s.day !== day) || (state.vo && !s.vo) || h < from || h >= to) continue;
    if (q && !`${s.key} ${D.alt[s.key] || ""} ${norm(s.film)}`.includes(q)) continue;
    const f = films.get(s.key) || films.set(s.key, { film: s.film, days: new Map() }).get(s.key);
    const cins = f.days.get(s.day) || f.days.set(s.day, new Map()).get(s.day);
    (cins.get(s.cinema) || cins.set(s.cinema, []).get(s.cinema)).push(s);
  }

  const dist = {};  // cinema -> km, only with "Vicino a me" on
  if (state.near) for (const [id, c] of Object.entries(D.cinemas)) dist[id] = c.lat == null ? Infinity : km(state.pos, c);
  let html = state.geoMsg ? `<p class="note">${esc(state.geoMsg)}</p>` : "";
  if (day !== "all" && missing[day]?.length) {
    html = `<p class="note">${partial.has(day) ? "Per questo giorno molte sale non hanno ancora pubblicato gli orari. " : ""}` +
      `Nessun orario (ancora) per: ${missing[day].map(c => esc(D.cinemas[c].name)).join(", ")}.</p>`;
  }
  for (const f of films.values()) {
    html += `<article><h2 class="display">${esc(f.film)}</h2>`;
    for (const [d, cins] of f.days) {
      if (day === "all") html += `<h3 class="display">${dayLabel(d)}${partial.has(d) ? " <small>(parziale)</small>" : ""}</h3>`;
      const order = state.near ? [...cins].sort((a, b) => dist[a[0]] - dist[b[0]]) : cins;  // nearest first
      for (const [cid, list] of order) {
        const c = D.cinemas[cid];
        const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${c.name}, ${c.address}, Milano`);
        html += `<div class="cin"><div class="where"><span class="name">${esc(c.name)}</span>` +
          (state.near && isFinite(dist[cid]) ? `<span class="dist">${fmtKm(dist[cid])}</span>` : "") +
          `<a class="map" href="${maps}" target="_blank" rel="noopener" aria-label="${esc(c.address)}, apri in Google Maps">` +
          `${PIN}${esc(c.address)}</a></div>` +
          list.map(s => `<a class="t display${s.vo ? " vo" : ""}" href="${safeUrl(s.url)}" target="_blank" rel="noopener"` +
            ` aria-label="${s.start.slice(11)}${s.vo ? ", versione originale" : ""}, ${esc(c.name)}">${s.start.slice(11)}</a>`).join("") +
          `</div>`;
      }
    }
    html += `</article>`;
  }
  if (!films.size) html += `<div class="empty"><p>Nessuno spettacolo con questi filtri.</p>` +
    `<button type="button" class="chip" id="reset">Mostra tutti i giorni e gli orari</button></div>`;
  $("#list").innerHTML = html;
}

function renderStatus() {
  const up = new Date(D.updated), hours = (Date.now() - up) / 36e5;
  const when = up.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const msgs = [isoDay(up) === isoDay(new Date()) ? `Aggiornato alle ${when}` : `Aggiornato il ${up.toLocaleDateString("it-IT")} alle ${when}`];
  if (hours > 6) msgs.push(`gli orari hanno più di ${Math.floor(hours)} ore, potrebbero essere cambiati`);
  if (D.failed.length) msgs.push(`non aggiornati: ${D.failed.join(", ")}`);
  $("#status").textContent = msgs.join("; ") + ".";
  $("#status").classList.toggle("warn", hours > 6 || D.failed.length > 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "reset") Object.assign(state, { day: "all", dayTouched: true, slot: "all", vo: false });
  else if (b.dataset.day) Object.assign(state, { day: b.dataset.day, dayTouched: true });
  else if (b.dataset.slot) state.slot = b.dataset.slot;
  else if (b.dataset.vo) state.vo = !state.vo;
  else if (b.id === "near") { if (state.near) state.near = false; else if (!state.locating) return locate(); }
  else return;
  render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });

function load() {
  return fetch("data.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
    D = d;
    const nowS = nowStamp(), today = isoDay(new Date(Date.now() - 5 * 36e5));  // cinema day: 00:30 is still "tonight"
    const shows = {}, cinemas = {};
    for (const s of D.shows) {
      shows[s.day] = (shows[s.day] || 0) + 1;
      (cinemas[s.day] ||= new Set()).add(s.cinema);
    }
    days = Object.keys(shows).filter(k => k >= today).sort();
    const active = Object.keys(D.cinemas), busiest = Math.max(...Object.values(shows));
    // a future day is "partial" when it's mostly presales: few shows, or most cinemas not published yet.
    // Today never is: late in the evening few shows are simply left.
    partial = new Set(days.filter(k => k > today && (shows[k] < busiest * 0.4 || cinemas[k].size < active.length / 2)));
    missing = Object.fromEntries(days.filter(k => k > today).map(k => [k, active.filter(c => !cinemas[k].has(c))]));
    // default: the first day that still has a show to catch (late at night that's tomorrow)
    const next = D.shows.find(s => s.start >= nowS);
    if (!state.dayTouched) state.day = next ? next.day : "all";
    renderStatus();
    render();
    if (state.near) locate();  // back on the tab: you may have moved
  }).catch(() => {
    $("#status").textContent = "Non riesco a caricare gli orari: controlla la connessione e ricarica la pagina.";
    $("#status").classList.add("warn");
  });
}
load();
// phones restore a backgrounded tab without reloading it: refresh data, "Oggi" and the staleness banner
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("pageshow", e => { if (e.persisted) load(); });
</script>
</body>
</html>
